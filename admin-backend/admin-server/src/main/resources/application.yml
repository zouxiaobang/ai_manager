server:
  port: 8080
  # 允许局域网设备（ESP 副屏、手机）访问
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-manager-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    async:
      request-timeout: 3600000
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_manager_admin}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  # pgvector 数据源（PostgreSQL）
  datasource-pg:
    url: jdbc:postgresql://${PGVECTOR_HOST:192.168.0.118}:${PGVECTOR_PORT:5432}/${PGVECTOR_DATABASE:ai_manager_rag}
    username: ${PGVECTOR_USER:ai_manager}
    password: ${PGVECTOR_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ai-manager:
  upload:
    ecommerce-path: uploads/ecommerce
    notebook-images-path: uploads/notebook/images
  deploy:
    backend-jar-path: ${DEPLOY_BACKEND_JAR_PATH:/opt/ai-manager/backend/admin-server.jar}
    frontend-index-path: ${DEPLOY_FRONTEND_INDEX_PATH:/var/www/ai-manager/index.html}
    runner:
      enabled: false
      mode: ${DEPLOY_RUNNER_MODE:auto}
      project-root: ${AI_MANAGER_ROOT:}
      run-as-user: ${DEPLOY_RUN_AS_USER:}
      git-pull-enabled: ${DEPLOY_GIT_PULL:true}
    sql-terminal:
      node118:
        host: ${DEPLOY_SQL_NODE118_HOST:192.168.0.118}
        port: ${DEPLOY_SQL_NODE118_PORT:3306}
        database: ${DEPLOY_SQL_NODE118_DATABASE:ai_manager_admin}
        username: ${DEPLOY_SQL_NODE118_USER:ai_manager}
        password: ${DEPLOY_SQL_NODE118_PASSWORD:123456}
    log-file: ${DEPLOY_LOG_FILE:}
  baidu-pan:
    # P1-3：真实密钥已外置到环境变量（本地值见根目录 .env），不再提交 git
    app-key: ${BAIDU_APP_KEY:}
    secret-key: ${BAIDU_SECRET_KEY:}
    app-folder-name: ai_blog
    # 环境子目录：dev 写入 /apps/ai_blog/dev/...；生产留空沿用 /apps/ai_blog/...
    environment-folder: ${BAIDU_PAN_ENV_FOLDER:}
    default-user-id: 1
  rag:
    upload-path: ${RAG_UPLOAD_PATH:uploads/rag-docs}
    max-retry: 3
    # 启动期校验 PG 数据源：绑定确为 PostgreSQL 且 rag_vectors 表存在，错绑/失联启动即失败；false 可跳过
    datasource-probe-enabled: ${RAG_DATASOURCE_PROBE_ENABLED:true}
    chunk:
      max-size: 500
      overlap: 50
      strategy: recursive
    search:
      top-k: 5
      # 联调实测自然问句余弦相似度约 0.55~0.69，0.72 会误滤掉命中片段，放宽到 0.65
      similarity-threshold: 0.65
  ai-knowledge:
    # P1-3：保存模型/Embedding 配置时校验 apiBaseUrl（SSRF 防护，拒绝内网/环回/元数据地址）；false 关闭
    validate-api-base-url: true
  note-storage:
    local-root: uploads/notebook-content
    cache-ttl-seconds: 3600
    cache-max-mb: 512

logging:
  level:
    com.ai.manager.system.mapper: warn
